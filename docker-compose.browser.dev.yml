name: librechat-browser-dev

services:
  app:
    container_name: librechat-browser-dev
    image: skylinebiz/librechat-browser:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "${DEV_HTTP_PORT:-8458}:3090"
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      HOST: 0.0.0.0
      PORT: 3080
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      LIBRECHAT_TEMP_CREDENTIALS_PATH: /app/data/.env.temp
      BROWSER_PROFILE_DIR: /app/data/browser-profiles
      ALLOW_REGISTRATION: "true"
      SESSION_COOKIE_SECURE: "false"
      SCHEDULES_SINGLE_PROCESS: "true"
    volumes:
      - .:/app
      - browser_dev_node_modules:/app/node_modules
      - ./data/dev/librechat:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - mongodb
    restart: unless-stopped

  mongodb:
    container_name: librechat-browser-dev-mongodb
    image: mongo:8.0.20
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    volumes:
      - ./data/dev/mongodb:/data/db
    restart: unless-stopped

volumes:
  browser_dev_node_modules:
